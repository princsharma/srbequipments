  <script>
    (function () {
      var MOBILE = 1024;
      var wrap = document.getElementById('srb-header-wrap');
      var header = wrap ? wrap.querySelector('.site-header') : null;
      var toggle = document.getElementById('srbNavToggle');
      var nav = document.getElementById('srbSiteNav');
      var overlay = document.getElementById('srbNavOverlay');
  
      if (!toggle || !nav) return;
  
      function getHeaderHeight() {
        if (window.innerWidth <= 480) return '68px';
        if (window.innerWidth <= MOBILE) return '76px';
        return '90px';
      }

      function getUtilityBarHeight() {
        if (window.innerWidth <= 1024) return '36px';
        return '42px';
      }

      function setHeight() {
        var h = getHeaderHeight();
        var ub = getUtilityBarHeight();
        if (wrap) {
          wrap.style.setProperty('--utility-bar-height', ub);
          wrap.style.setProperty('--total-header-height', 'calc(' + h + ' + ' + ub + ')');
        }
        if (header) header.style.setProperty('--header-height', h);
        if (nav) nav.style.setProperty('--header-height', h);
        document.documentElement.style.setProperty('--header-height', h);
        document.documentElement.style.setProperty('--utility-bar-height', ub);
        document.documentElement.style.setProperty('--total-header-height', 'calc(' + h + ' + ' + ub + ')');
      }
  
      function portal() {
        var mobile = window.innerWidth <= MOBILE;
        if (mobile) {
          if (overlay && overlay.parentNode !== document.body) document.body.appendChild(overlay);
          if (nav.parentNode !== document.body) document.body.appendChild(nav);
        } else {
          if (overlay && wrap && overlay.parentNode === document.body) wrap.insertBefore(overlay, wrap.firstChild);
          if (nav && header && nav.parentNode === document.body) header.appendChild(nav);
        }
      }
  
      function menu(open) {
        nav.classList.toggle('is-open', open);
        toggle.classList.toggle('is-active', open);
        if (overlay) {
          overlay.classList.toggle('is-visible', open);
          overlay.setAttribute('aria-hidden', open ? 'false' : 'true');
        }
        document.documentElement.classList.toggle('srb-nav-open', open);
        toggle.setAttribute('aria-expanded', open);
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        if (!open) {
          var dd = document.getElementById('srbServicesDropdown');
          var btn = document.getElementById('srbServicesTrigger');
          if (dd) dd.classList.remove('is-open');
          if (btn) btn.setAttribute('aria-expanded', 'false');
        }
      }
  
      window.srbDiviToggleMenu = function (e) {
        if (e) e.preventDefault();
        portal();
        setHeight();
        menu(!nav.classList.contains('is-open'));
        return false;
      };
  
      window.srbDiviToggleServices = function (e) {
        if (e) e.preventDefault();
        if (window.innerWidth > MOBILE) return false;
        var dd = document.getElementById('srbServicesDropdown');
        var btn = document.getElementById('srbServicesTrigger');
        if (!dd || !btn) return false;
        var open = dd.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', open);
        return false;
      };
  
      var SCROLL_THRESHOLD = 200;
      function updateScrollState() {
        if (!header) return;
        header.classList.toggle('is-scrolled', window.scrollY > SCROLL_THRESHOLD);
        setHeight();
      }
      window.addEventListener('scroll', updateScrollState, { passive: true });
      portal();
      setHeight();
      updateScrollState();
  
      window.addEventListener('resize', function () {
        portal();
        setHeight();
      });
  
      if (overlay) overlay.addEventListener('click', function () { menu(false); });
  
      nav.querySelectorAll('.site-nav__link:not(.nav-dropdown__trigger):not(.site-nav__call), .nav-dropdown__menu a, .site-nav__drawer-head a').forEach(function (link) {
        link.addEventListener('click', function () {
          if (window.innerWidth <= MOBILE) menu(false);
        });
      });
  
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') menu(false);
      });
    })();
  </script>
